<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="indBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C0519" />
      <stop offset="100%" stop-color="#2B040F" />
    </linearGradient>
    <pattern id="hazardStripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#F59E0B" />
      <rect x="20" width="20" height="40" fill="#111827" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#indBg)" />

  <!-- Industrial hazard top & bottom accents -->
  <rect x="0" y="0" width="1200" height="12" fill="url(#hazardStripes)" />
  <rect x="0" y="888" width="1200" height="12" fill="url(#hazardStripes)" />

  <!-- Top Pill: JUST 15 MINS FROM IMT -->
  <g transform="translate(400, 45)">
    <rect width="400" height="48" rx="24" fill="#FBBF24" stroke="#F59E0B" stroke-width="2" />
    <text x="200" y="32" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" fill="#111827" letter-spacing="3">
      ★ JUST 15 MINS FROM IMT ★
    </text>
  </g>

  <!-- Massive Headline: INDUSTRIAL PLOTS -->
  <text x="600" y="165" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="68" font-weight="900" fill="url(#yellowGrad)" letter-spacing="5">
    INDUSTRIAL PLOTS
  </text>

  <!-- Subheadline: SMART LOCATION. BETTER PRICE. HIGHER RETURNS. -->
  <text x="600" y="215" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="3">
    SMART LOCATION • BETTER PRICE • HIGHER RETURNS
  </text>
  <line x1="280" y1="235" x2="920" y2="235" stroke="#FBBF24" stroke-width="2" />

  <!-- Comparison Pricing Showcase Box -->
  <g transform="translate(150, 270)">
    <!-- Left Box: This Project (Save over 50%) -->
    <rect x="0" y="0" width="420" height="240" rx="20" fill="url(#greenCard)" stroke="#10B981" stroke-width="3" />
    <!-- Best Value Pill -->
    <rect x="30" y="20" width="190" height="32" rx="16" fill="#10B981" />
    <text x="125" y="42" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
      OUR PROJECT
    </text>
    <text x="210" y="90" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#A7F3D0" letter-spacing="1">
      JUST 15 MINS FROM IMT
    </text>
    <text x="210" y="155" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="42" font-weight="900" fill="#34D399">
      ₹55,700
    </text>
    <text x="210" y="195" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="18" font-weight="700" fill="#E2E8F0">
      PER SQ. YARD
    </text>

    <!-- Right Box: Inside IMT (Expensive) -->
    <rect x="480" y="0" width="420" height="240" rx="20" fill="url(#redCard)" stroke="#EF4444" stroke-width="2" opacity="0.9" />
    <rect x="510" y="20" width="140" height="32" rx="16" fill="#EF4444" />
    <text x="580" y="42" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
      INSIDE IMT
    </text>
    <text x="690" y="90" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="20" font-weight="800" fill="#FECDD3" letter-spacing="1">
      IMT CORE AREA
    </text>
    <!-- Strikethrough price -->
    <g>
      <text x="690" y="155" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="42" font-weight="900" fill="#F87171">
        ₹1,25,000
      </text>
      <line x1="560" y1="145" x2="820" y2="145" stroke="#FFFFFF" stroke-width="4" />
    </g>
    <text x="690" y="195" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="18" font-weight="700" fill="#E2E8F0">
      PER SQ. YARD
    </text>
  </g>

  <!-- Big Savings Highlight Pill -->
  <g transform="translate(350, 545)">
    <rect width="500" height="60" rx="30" fill="#F59E0B" stroke="#FEF08A" stroke-width="2" />
    <text x="250" y="39" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="24" font-weight="900" fill="#111827" letter-spacing="2">
      ⚡ SAVE OVER 50% ON LAND COST! ⚡
    </text>
  </g>

  <!-- 4 Strategic Benefits -->
  <g transform="translate(150, 640)">
    <rect width="900" height="140" rx="18" fill="#1F2937" stroke="#374151" stroke-width="2" />
    
    <g transform="translate(50, 45)">
      <text x="0" y="0" font-family="'Montserrat', sans-serif" font-size="19" font-weight="800" fill="#FBBF24">
        ✔ STRATEGIC LOCATION
      </text>
      <text x="0" y="45" font-family="'Montserrat', sans-serif" font-size="19" font-weight="800" fill="#FBBF24">
        ✔ EXCELLENT CONNECTIVITY
      </text>
    </g>

    <g transform="translate(480, 45)">
      <text x="0" y="0" font-family="'Montserrat', sans-serif" font-size="19" font-weight="800" fill="#FBBF24">
        ✔ INDUSTRIAL ZONE BENEFITS
      </text>
      <text x="0" y="45" font-family="'Montserrat', sans-serif" font-size="19" font-weight="800" fill="#FBBF24">
        ✔ HIGH GROWTH POTENTIAL
      </text>
    </g>
  </g>

  <!-- Location Footer -->
  <text x="600" y="830" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="17" font-weight="700" fill="#94A3B8" letter-spacing="2">
    NEAR IMT FARIDABAD, HARYANA • EXCELLENT HIGHWAY ACCESS
  </text>
</svg>